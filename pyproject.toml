[project]
name = "madalena-network-intelligence"
version = "0.1.0"
description = "Multi-tenant network inventory and correlation platform for Hermes"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
